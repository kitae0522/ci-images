name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache-dependency-path: tools/workflow-policy/go.sum
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: "images/*/Dockerfile"
          recursive: true
          config: .hadolint.yaml
      - name: Verify workflow policy module
        working-directory: tools/workflow-policy
        run: |
          go mod verify
          go test ./...
          go run . ../..
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../../.github/workflows/*.yml
      - run: python3 tests/workflow-trivy-version-checker-test.py
      - run: python3 tests/workflow-trivy-version-test.py
      - run: scripts/build-and-test.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ci-ubuntu-base:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ci-ubuntu-docker:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Report fixed high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ci-ubuntu-docker:test
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
